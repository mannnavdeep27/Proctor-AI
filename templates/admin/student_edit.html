{% extends "admin/base.html" %}
{% block title %}Edit student{% endblock %}
{% block content %}
<div class="admin-head"><h1>Edit student</h1><a class="btn btn-secondary" href="{{ url_for('admin.students') }}">{{ icon("arrowl") }} Students</a></div>
<form method="post" class="card" data-loading style="max-width:560px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field"><label>Gmail (cannot be changed)</label><input class="input" value="{{ user.email }}" disabled></div>
  <div class="field"><label>Full name</label><input class="input" name="name" value="{{ user.name }}" required></div>
  <div class="field"><label>Roll No.</label><input class="input" name="roll" value="{{ user.roll }}" required></div>
  <div class="grid grid-2"><div class="field"><label>Branch</label><select class="input" name="branch">{% for b in branches %}<option {{ 'selected' if b == user.branch }}>{{ b }}</option>{% endfor %}</select></div>
  <div class="field"><label>Year</label><select class="input" name="year">{% for y in years %}<option {{ 'selected' if y == user.year }}>{{ y }}</option>{% endfor %}</select></div></div>
  <div class="field"><label>New password (optional)</label><input class="input" type="password" name="new_password" autocomplete="new-password"><div class="hint">Leave empty to keep the current password. Setting one logs the student out.</div></div>
  <button class="btn btn-primary">Save</button></form>
{% endblock %}
