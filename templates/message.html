{% extends "layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="center-page"><div class="card msg-card">
  <div class="msg-ic {{ 'warn' if tone == 'warn' else '' }}">{{ icon("alert" if tone == "warn" else "clock") }}</div>
  <h2>{{ title }}</h2>
  <p class="muted">{{ text }}</p>
  {% if ts %}<p><b class="js-time" data-ts="{{ ts }}">{{ ts|utcfmt }}</b></p>{% endif %}
  <div class="btn-row" style="justify-content:center;margin-top:18px">
    {% if me %}<a class="btn btn-primary" href="{{ url_for('student.dashboard') }}">Back to dashboard</a>
    {% else %}<a class="btn btn-primary" href="{{ url_for('auth.login_page') }}">Go to login</a>{% endif %}
  </div>
</div></div>
{% endblock %}
